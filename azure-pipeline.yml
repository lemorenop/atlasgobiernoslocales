trigger:
  branches:
    include:
      - main
      - segunda-etapa
pr: none

# Variables (puedes mover los secretos a Library/Variable Group o Key Vault)
variables:
  NEXT_PUBLIC_MAPBOX_TOKEN: 'pk.eyJ1IjoiZGlzLWNhZiIsImEiOiJjbTlkNnQ4Y2wwemt0MmtvbWQ4bHRqb3hwIn0.gGRD-8mup5EAJIMTP56xug'
  NEXT_PUBLIC_MAPBOX_STYLE_TOKEN: 'pk.eyJ1IjoiZGlzLWNhZiIsImEiOiJjbTlkMnRiaGkwOTU5MmlvbjN3YWhobW94In0.3nz3-vM7MNId7xy7Y9q_aQ'
  NEXT_PUBLIC_GA_MEASUREMENT_ID: 'G-MWSK6BRGGX'
  NEXT_PUBLIC_URL: 'https://azapp-atlas20251215-cr.azurewebsites.net'

  AZURE_SERVICE_CONNECTION: 'SC-WEBATLAS-CR-01'
  WEBAPP_NAME: 'azapp-atlas20251215-cr'
  NODE_VERSION: '22.x'   # << 22 LTS

stages:
# ---------- BUILD & PACKAGE ----------
- stage: BuildAndPackage
  displayName: Build and Package Next.js App
  condition: |
    or(
      eq(variables['Build.Reason'], 'Manual'),
      contains(variables['Build.SourceVersionMessage'], '#deploy')
    )
  jobs:
    - job: Build
      displayName: Build App
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - task: NodeTool@0
          displayName: "Set up Node.js"
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            set -e
            npm ci
            # Variables públicas para el build
            export NEXT_PUBLIC_MAPBOX_TOKEN="$(NEXT_PUBLIC_MAPBOX_TOKEN)"
            export NEXT_PUBLIC_MAPBOX_STYLE_TOKEN="$(NEXT_PUBLIC_MAPBOX_STYLE_TOKEN)"
            export NEXT_PUBLIC_GA_MEASUREMENT_ID="$(NEXT_PUBLIC_GA_MEASUREMENT_ID)"
            export NEXT_PUBLIC_URL="$(NEXT_PUBLIC_URL)"
            npm run build

            # Copiar estáticos al standalone (Next no los incluye por defecto)
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/

            # (Opcional) Si tienes server.js propio, cópialo. El standalone ya genera uno mínimo
            # cp server.js .next/standalone/
          displayName: "Build Next.js (standalone) y copiar estáticos"

        # Empaquetar el standalone en un ZIP
        - task: ArchiveFiles@2
          displayName: "Crear paquete ZIP para deploy"
          inputs:
            rootFolderOrFile: "$(System.DefaultWorkingDirectory)/.next/standalone"
            includeRootFolder: true
            archiveType: zip
            archiveFile: "$(Build.ArtifactStagingDirectory)/next-standalone-$(Build.BuildId).zip"
            replaceExistingArchive: true

        # Publicar el artefacto
        - task: PublishBuildArtifacts@1
          displayName: "Publicar artefacto: drop"
          inputs:
            PathtoPublish: "$(Build.ArtifactStagingDirectory)/next-standalone-$(Build.BuildId).zip"
            ArtifactName: "drop"
            publishLocation: "Container"

# ---------- DEPLOY ----------
- stage: Deploy
  displayName: Deploy to Azure Web App (Linux)
  dependsOn: BuildAndPackage
  condition: succeeded()
  jobs:
    - job: Deploy
      displayName: Deploy Job
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        # Descargar el artefacto publicado en este pipeline
        - task: DownloadBuildArtifacts@1
          displayName: "Descargar artefacto"
          inputs:
            buildType: current
            downloadType: single
            artifactName: drop
            itemPattern: "**/*.zip"
            downloadPath: "$(System.ArtifactsDirectory)"

        # Desplegar el ZIP al Azure Web App Linux mediante zipDeploy
        - task: AzureWebApp@1
          displayName: "Deploy to Azure Web App (zipDeploy)"
          inputs:
            azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
            appType: 'webAppLinux'
            appName: "$(WEBAPP_NAME)"
            package: "$(System.ArtifactsDirectory)/**/*.zip"
